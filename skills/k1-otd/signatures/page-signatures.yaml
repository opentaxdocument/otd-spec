
# ==========================================================================
# K-1 page signature definitions
# ==========================================================================
# Schema version: k1-page-signatures/1.0
# Status: draft
#
# PURPOSE
#   Deterministic, producer-neutral page-role classification for multi-page
#   Schedule K-1 packages.
#
# DESIGN PRINCIPLE -- STRUCTURE FIRST, VOCABULARY SECOND
#   A page's ROLE is determined primarily by the SHAPE of its content
#   (what kinds of rows it contains), not by its title text. Titles vary
#   by producer; structure is imposed by the tax form itself.
#
#   Title phrases are a SECONDARY corroborating signal only, and every
#   phrase below is an OBSERVED-OR-PLAUSIBLE SYNONYM, not a producer
#   fingerprint. Adding a new producer must be a data change here, never
#   a code change.
#
# WHY THIS FILE EXISTS (defect record)
#   The prior classifier tested bare lowercase substrings against whole-page
#   text. Two matches were catastrophic:
#     "eci"          matched inside  sp-eci-fied / pr-eci-ous / d-eci-sion
#     "state income" matched inside  real e-state income
#   The second routed a line-item-detail page to the state-schedule section.
#   ALL vocabulary matching in this file is therefore word-boundary
#   anchored, and short tokens require corroboration.
# ==========================================================================

schema_version: "k1-page-signatures/1.0"
status: draft

# --------------------------------------------------------------------------
# Row-level patterns. Producer-neutral: they describe tax-form structure
# (a line/box reference, a code letter, a monetary amount), not any
# particular vendor's wording.
# --------------------------------------------------------------------------
row_patterns:

  # A coded overflow row: a line/box reference WITH a code suffix, a
  # description, and a trailing monetary amount.
  #   LINE 11B - OTHER INCOME | 80,700
  #   Line 20 Code AN ..... 107,100
  #   11B  Something  (2,400)
  coded_entry_row:
    - '(?im)^\s*(?:line|box)?\s*(\d{1,2})\s*([A-Z]{1,2})\b.*?[|\s]\(?\$?\s*-?[\d,]+(?:\.\d{1,2})?\s*\)?\s*$'
    - '(?im)^\s*(?:line|box)\s+(\d{1,2})\s*,?\s*code\s+([A-Z]{1,2})\b.*?\(?\$?\s*-?[\d,]+(?:\.\d{1,2})?\s*\)?\s*$'

  # A bare line/box reference WITHOUT a code suffix plus an amount.
  # Distinguishes "detail for line 1" from "coded entry 11B".
  uncoded_line_row:
    - '(?im)^\s*(?:line|box)\s*(\d{1,2})\b(?![A-Z]).*?[|\s]\(?\$?\s*-?[\d,]+(?:\.\d{1,2})?\s*\)?\s*$'

  # A label/amount row with NO line or box reference at all -- the
  # component rows of a detail breakdown.
  label_amount_row:
    - '(?im)^\s*(?![Ll]ine\b)(?![Bb]ox\b)[A-Za-z][^|]{2,}\|\s*\(?\$?\s*-?[\d,]+(?:\.\d{1,2})?\s*\)?\s*$'

  # A subtotal / total row.
  total_row:
    - '(?im)^\s*(?:sub)?total\b[^|]*\|?\s*\(?\$?\s*-?[\d,]+(?:\.\d{1,2})?\s*\)?\s*$'

  # A heading that scopes the page to ONE line/box and declares itself a
  # breakdown. The trailing keyword is matched from detail_keywords below.
  detail_scope_heading:
    - '(?im)^\s*(?:line|box)\s*(\d{1,2}[A-Z]{0,2})\b.*\b(?:detail|breakdown|components?|composition)\b'

  # A row whose FIRST cell is a 2-letter jurisdiction code.
  jurisdiction_row:
    - '(?im)^\s*([A-Z]{2})\s*\|'
    - '(?im)^\s*([A-Z]{2})\s+-?\(?\$?[\d,]'

  # Column headers referencing form lines -- a grid keyed by line number.
  line_column_header:
    - '(?i)\bline\s+\d{1,2}[A-Z]{0,2}\b(?:\s*\|?\s*\bline\s+\d{1,2}[A-Z]{0,2}\b){2,}'

# --------------------------------------------------------------------------
# Face-page structural markers. The face page is the only page carrying all
# three part headings plus the form identity.
# --------------------------------------------------------------------------
face_markers:
  required_any:
    - '(?i)\bschedule\s+k-?1\b'
    - '(?i)\bform\s+1065\b'
  required_parts:
    - '(?i)\bpart\s+I\b(?!I)'
    - '(?i)\bpart\s+II\b(?!I)'
    - '(?i)\bpart\s+III\b'
  min_parts: 2

# --------------------------------------------------------------------------
# Jurisdiction codes (USPS). Reference data, not producer data.
# --------------------------------------------------------------------------
jurisdiction_codes:
  - AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY
  - LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH
  - OK, OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY, PR, VI, GU

# Spelled-out jurisdiction names. Producers print either the USPS code or
# the full name in the first column of a state grid; both must resolve.
# Observed defect: requiring a 2-letter code scored ZERO jurisdiction rows
# on pages whose first column reads "ALABAMA", "ALASKA", "ARIZONA", ...
jurisdiction_names:
  - alabama, alaska, arizona, arkansas, california, colorado, connecticut
  - delaware, district of columbia, florida, georgia, hawaii, idaho, illinois
  - indiana, iowa, kansas, kentucky, louisiana, maine, maryland, massachusetts
  - michigan, minnesota, mississippi, missouri, montana, nebraska, nevada
  - new hampshire, new jersey, new mexico, new york, north carolina
  - north dakota, ohio, oklahoma, oregon, pennsylvania, rhode island
  - south carolina, south dakota, tennessee, texas, utah, vermont, virginia
  - washington, west virginia, wisconsin, wyoming
  - puerto rico, virgin islands, guam, american samoa, northern mariana islands

# --------------------------------------------------------------------------
# Title vocabulary -- SECONDARY signal only.
# Every phrase is matched with word boundaries after normalization.
# Multiple synonyms per role; extend here when onboarding a producer.
# --------------------------------------------------------------------------
title_lexicon:

  coded_overflow:
    - overflow statement
    - overflow statements
    - overflow
    - supplemental schedule
    - continuation of schedule k-1
    - additional codes
    - code detail

  line_item_detail:
    - line item detail
    - line item details
    - detail schedule
    - detail schedules
    - supporting detail
    - supplemental detail
    - itemized detail

  state_jurisdiction_grid:
    - state source income
    - distributive share of state
    - state allocation
    - state apportionment
    - jurisdiction detail
    - state and local detail

  state_tax_summary:
    - state tax information
    - state tax summary
    - state withholding summary
    - composite return

  activity_schedule:
    - schedule of activities
    - activity schedule
    - activity detail

  narrative_footnote:
    - footnote
    - footnotes
    - additional information
    - supplemental information
    - notes to schedule k-1
    - partner notes

# Keywords used by detail_scope_heading. Kept separate so the regex
# stays generic while the vocabulary stays editable.
detail_keywords:
  - detail
  - details
  - breakdown
  - components
  - composition

# --------------------------------------------------------------------------
# Decision thresholds. Structural evidence dominates; title evidence only
# corroborates or breaks a tie.
# --------------------------------------------------------------------------
thresholds:

  # Minimum rows of a kind before that structural signal is credited.
  min_coded_entry_rows: 3
  min_label_amount_rows: 3
  min_jurisdiction_rows: 3
  min_total_rows: 1

  # Fuzzy title matching (difflib token ratio, stdlib -- no new dependency).
  # Both gates must pass or the title signal is DISCARDED entirely.
  # Modelled on the score+margin pattern already proven in this project:
  # a score gate alone accepts confident nonsense; the margin gate is what
  # actually detects ambiguity.
  title_match_score: 0.82
  title_match_margin: 0.08

  # Prose detection: a page is narrative when it has few structured rows
  # and a high ratio of alphabetic words to numeric tokens.
  prose_min_alpha_ratio: 0.80
  prose_max_structured_rows: 2

  # Ambiguity gate. If the top two structural candidates are within this
  # fraction of each other, the page is UNRESOLVED and escalates.
  # It is NEVER silently defaulted to a role.
  structural_ambiguity_margin: 0.15

# --------------------------------------------------------------------------
# Continuation. Producers frequently repeat a section across pages while
# printing the title only on the first page. A page that is structurally
# indistinguishable from its predecessor and carries no competing title
# inherits the predecessor's role, explicitly marked as a continuation.
# --------------------------------------------------------------------------
continuation:
  enabled: true
  inheritable_roles:
    - coded_overflow
    - line_item_detail
    - state_jurisdiction_grid
    - narrative_footnote
  # Structural fingerprint must agree on these signal names to inherit.
  fingerprint_signals:
    - coded_entry_rows
    - label_amount_rows
    - jurisdiction_rows
    - total_rows
  # A page whose own title matches a DIFFERENT role never inherits.
  respect_own_title: true

# --------------------------------------------------------------------------
# Role -> pipeline section mapping. Keeps role semantics separate from
# the assembler's fragment names.
# --------------------------------------------------------------------------
role_to_section:
  face_page: face_page
  coded_overflow: overflow_statements
  line_item_detail: line_item_details
  state_jurisdiction_grid: state_schedules
  state_tax_summary: state_schedules
  activity_schedule: activity_schedule
  narrative_footnote: footnotes
  unresolved: unresolved_requires_review
